aid: foresight-diagnostics
name: Foresight Diagnostics
description: 'Foresight Diagnostics is a CLIA-certified, CAP-accredited cancer diagnostics
  company founded in 2020 in Boulder, Colorado by Stanford physicians and scientists,
  and since February 2026 a wholly owned subsidiary of Natera. Its Foresight CLARITY
  minimal residual disease (MRD) platform is a liquid-biopsy test powered by proprietary
  PhasED-Seq phased-variant sequencing and bioinformatics, detecting circulating tumor
  DNA at an analytical sensitivity below one part per million across lymphoma, lung and
  other solid tumors. The company sells laboratory testing services to biopharma sponsors,
  academic researchers and clinicians rather than software: it operates a central
  laboratory and publishes no public developer program, API, SDK or machine-readable
  specification of any kind.'
